# 本地开发用 Postgres 与 Redis。
#
# **两者都不是生产形态**：口令是明文的本地固定值，生产运行时一律来自环境变量（C10）。
# 这里的 `vca_owner` 是**迁移属主**角色，不是运行时角色；应用连库必须用 `app_user`
# （见 `infra/db/roles.sql` 与 `apps/api/prisma.config.ts` 的注释）。
#
# ## 从零开始（以及「为什么我的库看起来是旧的」）
#
#     pnpm db:setup      # = db:up → prisma migrate deploy → 从容器里跑 apply-grants.sql
#
# `prisma migrate deploy` 需要 `MIGRATE_DATABASE_URL`，且它**不再**默默回落到本机兜底值
# （最终评审的 Minor：兜底会让「忘了配置」与「故意本地迁移」无法区分）。本地有两条路：
#
#     ① 在本机 `.env` 里把 MIGRATE_DATABASE_URL 写成 compose 的值（口令是 owner_pw，
#        注意 `.env.example` 里那个是 CHANGE_ME 占位符，照抄跑不通）；
#     ② 在 `.env` 里写 `MIGRATE_ALLOW_LOCAL_FALLBACK=1`，用 `apps/api/prisma.config.ts`
#        里那个与 compose 对齐的兜底连接串。
#
# 顺序是硬性的：建角色 → 迁移 → **授权**。授权必须在迁移之后（`GRANT` 只作用于执行那一刻
# 已存在的对象），而 compose 侧没有它的入口，所以由根脚本 `pnpm db:grants` 在迁移后执行。
#
# **注意数据卷**：`docker-entrypoint-initdb.d` 只在**数据卷为空**时执行一次，迁移台账也留在
# 卷里。因此本机若已有旧的 `vca` 卷（上一次会话留下的），会出现两种「看着像新库、其实不是」
# 的失败：① `roles.sql` 的改动不会再生效；② 迁移被重新生成过时，在已迁过的卷上会与台账冲突
# （Task 3 实测踩到过）。遇到这两类现象，先清卷再重建：
#
#     pnpm db:down       # = docker compose down -v（**会删掉本地库里的全部数据**）
#     pnpm db:setup
#
# CI 不受此影响：那边每次都是一个全新的库（见 `.github/workflows/ci.yml`）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vca_owner
      POSTGRES_PASSWORD: 'owner_pw'
      POSTGRES_DB: vca
      # C6（全 UTC）的纵深防御：显式把容器与会话时区钉在 UTC，使本地开发与 CI 一致。
      # 真正的保障在列类型上——所有时间戳列都是 `timestamptz`（见 schema.prisma 顶部注释），
      # 已经存绝对时刻；这里只是让「万一有裸 timestamp 或依赖 CURRENT_TIMESTAMP 的语句」
      # 也不会因为镜像默认时区不同而产生行为分叉。
      TZ: UTC
      PGTZ: UTC
    ports: ['5432:5432']
    volumes:
      # 只在**数据卷为空**的首次启动执行一次（docker-entrypoint-initdb.d 的语义）。
      # 因此这里放的必须只是「建角色 + 授权」这类与 schema/表无关、且幂等的语句：
      # 此刻 Prisma 迁移尚未运行，`auth`/`audit`/`notify` 三个 schema 与任何表都还不存在，
      # 任何 `ALTER SCHEMA`/`GRANT ... ON ALL TABLES` 在此都会失败（或对 ALL TABLES 静默
      # 授予零个对象）。建表权限与 append-only 的 GRANT/REVOKE 在迁移之后由
      # `infra/db/apply-grants.sql` 施加。
      - ./db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      # 迁移后的授权脚本。它**不能**放进 `docker-entrypoint-initdb.d`（那时表还不存在），
      # 而是由根脚本 `pnpm db:grants` 在 `prisma migrate deploy` 之后从容器里执行；
      # 挂进来只是为了让那一步在 Windows 与 Linux 上都不依赖宿主的 psql 客户端。
      - ./db/apply-grants.sql:/opt/vca/apply-grants.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vca_owner -d vca']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
