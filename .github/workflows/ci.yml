name: CI

# P0 的验收流水线（设计 §13.2 / §13.4）：安全边界、架构约束、数据库引导顺序，
# 每一项都必须由**实际运行的命令**证明，而不是靠本地跑过一次的印象。
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # 迁移/DDL 用的真实 Postgres（**不是**测试用的那个：集成测试按设计自起 testcontainers，
      # 见 tests/helpers/db.ts）。它在这里的作用是验证「全新的库 + 文档规定的引导顺序」
      # 真的能建出可用且最小权限的运行期数据库——本地那种「已经迁过一次的卷」验证不了这件事。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vca_owner
          POSTGRES_PASSWORD: owner_pw
          POSTGRES_DB: vca
          # C6（全 UTC）：与 infra/docker-compose.yml 同值，避免 CI 与本地行为分叉。
          TZ: UTC
          PGTZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vca_owner -d vca"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.24.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0', cache: 'pnpm' }

      # C18：allowBuilds 已在 pnpm-workspace.yaml 中（含 testcontainers 的可选传递依赖），
      # 安装不应以非零码结束。
      - run: pnpm install --frozen-lockfile

      - name: 类型检查（K14：vitest 全绿不代表类型正确）
        run: pnpm typecheck

      - name: 安全 lint 门（C9：raw SQL / XSS / eval）
        run: pnpm lint

      - name: 架构守护（C5 / §3.3）
        run: pnpm arch

      # 显式装 psql，而不是假设 runner 镜像自带：GitHub 的 ubuntu 镜像内容随版本变化，
      # 社区里出现过「连接串有了、却没有 psql 客户端」的情况。引导步骤是 P0 的验收路径，
      # 不该押在镜像的偶然内容上（本地之所以不需要它，是因为 compose 把 psql 跑在容器里）。
      - name: 安装 psql 客户端
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # ── 数据库引导：顺序是硬性的，换一下就会得到「看起来成功、其实零权限」的库 ──
      #
      # 1. `infra/db/roles.sql` 只做「建角色 + GRANT CONNECT」，**必须最先**：
      #    后面的 GRANT 都要引用 app_user，角色不存在则直接报错。
      #    它在 compose 侧挂在 docker-entrypoint-initdb.d 上，只在**空数据卷**时执行一次；
      #    CI 的服务容器没有挂载任何初始化脚本，所以这里必须显式执行。
      # 2. `prisma migrate deploy` 以属主 vca_owner 建 schema 与表。
      # 3. `prisma generate` 生成客户端（测试进程要用）。
      # 4. `infra/db/apply-grants.sql` **必须在迁移之后**：`GRANT` 只作用于执行那一刻
      #    已存在的对象，新建的表不继承此前的 GRANT；这一步也承载 append-only 的
      #    `REVOKE UPDATE, DELETE`（不变式 #5）。compose 侧**没有**它的入口，
      #    所以本地是根脚本 `pnpm db:setup`，CI 是下面这段。
      #
      # 为什么不能省掉第 4 步：省掉之后 app_user 对这些表**一个权限都没有**
      # （`GRANT ... ON ALL TABLES IN SCHEMA auth` 在空 schema 上是静默的零授予），
      # 而这条流水线里唯一会碰这个库的就是本步骤——所以下一步专门来断言权限事实。
      - name: 数据库引导（建角色 → 迁移 → 生成客户端 → 授权）
        env:
          MIGRATE_DATABASE_URL: postgresql://vca_owner:owner_pw@127.0.0.1:5432/vca
        run: |
          set -euo pipefail
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/roles.sql
          pnpm --filter @vca/api db:migrate:deploy
          pnpm --filter @vca/api db:generate
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/apply-grants.sql

      # Ruling 1 的闭环：上一步「没报错」不等于「授权真的生效」。这里直接问 PostgreSQL
      # **十九件事**——运行期角色**能用**什么、**不能用**什么，以及能不能碰到迁移台账。
      #
      # 扩到 ledger（P2 / Task 4）与 asset.ownership_history（补 P1 的漏）的理由：
      # 预检实测这条断言此前**只覆盖 auth/audit 五项**，连 P1 新增的 append-only 表都不查
      # ——也就是说「ownership_history 不可改写」与「ledger 不可改写」这两条不变式在 CI 里
      # **没有见证**，只有集成用例（那是本机的，不是流水线的）。
      # 扩到 exchange（P3 / Task 2）的理由同款：三张状态机表**必须可写**（offers 的
      # `UPDATE` = t 是**验收面**——把 `GRANT SELECT, INSERT, UPDATE` 收窄成只有
      # SELECT/INSERT 时，状态机第一次转状态就 `permission denied`，而那只在生产上暴露），
      # 而**一条删除路径都没有**（三格的 `DELETE` = f）。
      # 期望值 t|t|f|f|f|f|f|t|t|f|t|f|f|f|f|t|f|f|f 的逐项含义见下面的 echo。
      # （这个字符串不是手写的猜测：Task 2 的验证脚本把它**从本文件解析出来**，
      #  对着真库跑了一遍再逐字比对，见 evidence/t2-migration-verify-*.txt。）
      #
      # 第 10 项（`ledger.accounts` 的 `DELETE` = **f**）是控制器 2026-10-06 的裁定：
      # P2 没有任何删账户的路径 ⇒ 这个能力没有合法使用者，而删掉的行恢复不回来
      # （对账护的是完整性、不是可用性）。理由逐条写在 `infra/db/apply-grants.sql` 那段注释里。
      #
      # 第二条腿（`relacl`）不是重复：`has_table_privilege` 回答的是「PostgreSQL 现在怎么
      # 判」，而 `aclexplode(relacl)` 读的是**授权记录本身**。两者一起才排得掉
      # 「某台库上被人手工 GRANT 过」与「某条 REVOKE 被删掉」这两类分歧。它同时把
      # 「schema 级 ALL TABLES 广播过、随后被逐表收回」这段历史钉进证据里。
      # P3 / Task 2 给 exchange 加了**同款的第二条腿**（下面第三段）。
      - name: 运行期角色的权限事实（不变式 #5 / Ruling 1 / P2 Task 4 / P3 Task 2）
        env:
          MIGRATE_DATABASE_URL: postgresql://vca_owner:owner_pw@127.0.0.1:5432/vca
        run: |
          set -euo pipefail
          actual=$(psql "$MIGRATE_DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "
            SELECT has_table_privilege('app_user','auth.users','SELECT'),
                   has_table_privilege('app_user','audit.audit_logs','INSERT'),
                   has_table_privilege('app_user','audit.audit_logs','UPDATE'),
                   has_table_privilege('app_user','audit.audit_logs','DELETE'),
                   has_table_privilege('app_user','public._prisma_migrations','SELECT'),
                   has_table_privilege('app_user','asset.ownership_history','UPDATE'),
                   has_table_privilege('app_user','asset.ownership_history','DELETE'),
                   has_table_privilege('app_user','ledger.accounts','UPDATE'),
                   has_table_privilege('app_user','ledger.accounts','INSERT'),
                   has_table_privilege('app_user','ledger.accounts','DELETE'),
                   has_table_privilege('app_user','ledger.entries','INSERT'),
                   has_table_privilege('app_user','ledger.entries','UPDATE'),
                   has_table_privilege('app_user','ledger.entries','DELETE'),
                   has_table_privilege('app_user','ledger.transactions','UPDATE'),
                   has_table_privilege('app_user','ledger.transactions','DELETE'),
                   has_table_privilege('app_user','exchange.swap_offers','UPDATE'),
                   has_table_privilege('app_user','exchange.swap_offers','DELETE'),
                   has_table_privilege('app_user','exchange.swap_contracts','DELETE'),
                   has_table_privilege('app_user','exchange.swap_obligations','DELETE')")
          echo "auth.users SELECT | audit_logs INSERT/UPDATE/DELETE | migrations SELECT | ownership_history UPDATE/DELETE | accounts UPDATE/INSERT/DELETE | entries INSERT/UPDATE/DELETE | transactions UPDATE/DELETE | offers UPDATE/DELETE | contracts DELETE | obligations DELETE = $actual"
          if [ "$actual" != "t|t|f|f|f|f|f|t|t|f|t|f|f|f|f|t|f|f|f" ]; then
            echo "::error::运行期角色权限不符合预期（期望 t|t|f|f|f|f|f|t|t|f|t|f|f|f|f|t|f|f|f）：$actual"
            echo "::error::多半是引导顺序错了（授权跑在迁移之前 → 对空 schema 静默授予零个对象），或 append-only 的 REVOKE UPDATE, DELETE 被删，或 ledger.accounts / exchange 三张表那些 REVOKE DELETE 被删。"
            exit 1
          fi

          # 第二条腿：直接读授权记录（`relacl`），逐表列出 app_user 的**能力集合**。
          # entries / transactions 必须恰好是 `INSERT,SELECT`——多一个字母就意味着
          # append-only 不成立。accounts 是可写的（物化余额），但**只有三个动词**：
          # `DELETE` 由控制器裁定撤掉（P2 没有删账户的路径）。
          acl=$(psql "$MIGRATE_DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "
            SELECT string_agg(c.relname || '=' || p.privs, '|' ORDER BY c.relname)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              CROSS JOIN LATERAL (
                SELECT COALESCE(string_agg(a.privilege_type, ',' ORDER BY a.privilege_type), '(none)') AS privs
                  FROM aclexplode(c.relacl) a WHERE a.grantee = 'app_user'::regrole
              ) p
             WHERE n.nspname = 'ledger' AND c.relkind = 'r'")
          echo "ledger relacl（app_user 的直接授权）: $acl"
          if [ "$acl" != "accounts=INSERT,SELECT,UPDATE|entries=INSERT,SELECT|transactions=INSERT,SELECT" ]; then
            echo "::error::ledger 的 ACL 不符合预期（期望 accounts 三项、entries/transactions 只有 INSERT,SELECT）：$acl"
            echo "::error::最可能的原因：apply-grants.sql 里 `REVOKE UPDATE, DELETE ON ledger.entries`（或 transactions 那一对）、或 `REVOKE DELETE ON ledger.accounts` 被删了。"
            exit 1
          fi

          # P3 / Task 2：`exchange` 的第二条腿（同款理由，同一个查询换一个 schema）。
          # 三张状态机表必须**恰好** `INSERT,SELECT,UPDATE`——多一个 `DELETE` 就意味着
          # 「删掉的合约无法被恢复」那条理由没有执行者。
          # 判别力（探针 S-1 实测）：把 apply-grants.sql 里那三条 `REVOKE DELETE` 删掉之后，
          # 这里打印 `swap_contracts=DELETE,INSERT,SELECT,UPDATE|…` 并以 `::error::` 退出 1，
          # 而集成层那条「删不掉」的拒绝用例**同时**变红（两条腿都真的在工作）。
          acl_exchange=$(psql "$MIGRATE_DATABASE_URL" -tA -v ON_ERROR_STOP=1 -c "
            SELECT string_agg(c.relname || '=' || p.privs, '|' ORDER BY c.relname)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              CROSS JOIN LATERAL (
                SELECT COALESCE(string_agg(a.privilege_type, ',' ORDER BY a.privilege_type), '(none)') AS privs
                  FROM aclexplode(c.relacl) a WHERE a.grantee = 'app_user'::regrole
              ) p
             WHERE n.nspname = 'exchange' AND c.relkind = 'r'")
          echo "exchange relacl（app_user 的直接授权）: $acl_exchange"
          if [ "$acl_exchange" != "swap_contracts=INSERT,SELECT,UPDATE|swap_obligations=INSERT,SELECT,UPDATE|swap_offers=INSERT,SELECT,UPDATE" ]; then
            echo "::error::exchange 的 ACL 不符合预期（期望三张表都恰好 INSERT,SELECT,UPDATE）：$acl_exchange"
            echo "::error::最可能的原因：apply-grants.sql 里 exchange 段的那三条 REVOKE DELETE 被删了。"
            exit 1
          fi

      # P2 / Task 1：手写 DDL（延迟约束触发器 / 条件化 CHECK）不在 Prisma 的模型里，
      # 因此「迁移被谁改过」只能靠 migrate diff 的**退出码**看。这一步必须在数据库引导
      # （migrate deploy + apply-grants）之后——它比的是**库**与**模型**，不是文件。
      #
      # ⚠️ 这条门证明的**只有**「Prisma 建模的东西（表/列/索引/外键）与库一致」。
      # 它**看不见**函数、约束触发器与 CHECK —— Task 1 实测：库里挂着手写的
      # plpgsql 函数 + DEFERRABLE 约束触发器 + CHECK 时，它照样报 `No difference detected.`
      # 因此**不要**把它当成手写 DDL 的见证；手写对象的存在性由 Task 4 的真库断言
      # （`pg_get_constraintdef` / `pg_trigger` 查询 + 行为用例）负责。
      # 完整实测（含另一条：`ledger` 不在 `datasource.schemas` 里时这条门对它结构性失明）
      # 见 docs/superpowers/notes/2026-10-06-p2-migration-drift.md。
      #
      # 退出码：prisma 的语义是「空=0 / 出错=1 / 非空=2」，但**经 pnpm 调用时 2 被包成 1**
      # （Task 1 实测：stderr 写着 `Command failed with exit code 2`，而 pnpm 自己退 1）。
      # 对本步的通过/不通过没有影响，但注释不要写成「非空=2」。
      #
      # Task 4 前置条件：`ledger` 必须已经进了 `datasource db` 的 `schemas` 数组
      # （加三个 model 时本来就要加，否则 Prisma 根本不管理 `ledger`）。两者必须在同一个
      # 提交里，否则这条门在 ledger 上是绿的**且看不见任何东西**。
      #
      # P3 / Task 2 补一句**实测**（P3 计划 Step 2 曾乐观地写成「本迁移整体是这条门的见证对象」，
      # 那是错的）：`exchange` 的迁移里也有六条手写 `CHECK`，其中一条是**条件化**的；
      # 删掉它之后这条门**照样以 0 退出**（探针 S-2 在本迁移上重测），而
      # `tests/integration/db/exchange-enforcement.test.ts` 真的变红。
      # ⇒ 边界与 P2 逐字相同：**Prisma 建模的那半**（三张表 / 列 / 索引 / 外键 / 唯一约束）
      # 由这条门见证；**手写的那半**由真库的 `pg_get_constraintdef` 断言见证。
      - name: 迁移零漂移（Prisma 建模面与库一致）
        env:
          MIGRATE_DATABASE_URL: postgresql://vca_owner:owner_pw@127.0.0.1:5432/vca
        run: pnpm --filter @vca/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # ── 测试 ──
      #
      # `unit` **必须整跑，不要加 `-t parseEnv` 之类的过滤**。
      # brief 的验收表把「缺失/占位密钥时进程拒绝启动」写成
      # `pnpm vitest run --project unit -t parseEnv`，Task 2 的复审已**实测证伪**那条命令的
      # 判别力：被过滤出来的用例只断言 `envSchema.parse({})` 会抛错——那是 schema **自己**
      # 保证的性质，与「进程是否真的因此起不来」无关。把 `ConfigModule` 从
      # `app.module.ts` 的 imports 里整个删掉（= 关掉 C10 的全部 fail-fast），
      # `-t parseEnv` **照样全绿**。Task 2 因此补了真正的接线用例
      # （`tests/unit/config/bootstrap-guard.test.ts` 的「引导期 fail-fast 接线」：
      # 删掉必填密钥后 import `app.module`，必须观察到拒绝启动）。
      # 那条例用**不在** `-t parseEnv` 的匹配范围内，所以这里整跑 unit project。
      - name: 单元测试（含 C10 引导期 fail-fast 接线）
        run: pnpm vitest run --project unit

      # P2 / Task 1（预检判决 1 的修复）：设计 §8.3/§13.3 把「≥10 万次随机操作的属性测试」
      # 写成验收判据，而此前 CI 里**没有**这一步、`property` project 也**没有任何用例**——
      # 一条今天没有执行者的验收判据等于不存在。它现在走与 security/architecture 同一条门
      # （json reporter 读**实际执行条数**并要求不低于登记的下限），因此
      # 「文件被改名 / 用例被 skip / project 名写错」都会红，而不是静默跳过。
      #
      # 为什么不能只写 `pnpm test:property`：那个脚本带 `--passWithNoTests`（为本地开发留的），
      # 实测**空 project 退出 0**——门在这一刻是空的却报成功。这道区别 Task 1 有双向取证。
      - name: 属性测试（金额契约 + 五条不变式的预算；≥10 万次随机操作，§8.3/§13.3）
        run: node scripts/assert-tests-ran.mjs property

      # Ruling 3：安全与架构两个 project 必须**自证不是空的**。
      # 直接 `vitest run --project X` 时，一个测试文件都没匹配到会让 vitest 自己失败；
      # 但「某个测试文件被改名/删除」它不会报警——那正是门被悄悄削弱的方式。
      # `scripts/assert-tests-ran.mjs` 用 json reporter 读出**实际执行条数**并与登记的下限比对。
      # 它内部跑的仍是不带 `--passWithNoTests` 的那条命令（Task 9 也把该标志从
      # `test:security` / `test:arch` 两个脚本上摘掉了，理由见 scripts 里的注释）。
      - name: 安全测试（默认拒绝 / 越权矩阵 / CSP / CSRF / 限流）
        run: node scripts/assert-tests-ran.mjs security

      - name: 架构守护测试（C5 / 验收 13.4）
        run: node scripts/assert-tests-ran.mjs architecture

      # 真 Postgres + 真 Redis（testcontainers，绝不 mock 数据库；§12）。
      # 已知的偶发抖动点是容器启动（曾观测到一次，重跑即绿）；刻意**不加 retry**：
      # 加重试会把「容器起不来」这类真实的基础设施问题一并掩盖掉。
      - name: 集成测试（testcontainers）
        run: pnpm vitest run --project integration

      # P3 / Task 4（控制器账本里 Task 3 段落末尾的裁定）：**按路径作用域**的下限。
      #
      # 上面两条 `unit` / `integration` 整跑的命令**不给这两类用例任何下限**：它们的规模与
      # 构成一直在变，钉总数只会制造噪音。代价是这两类里的用例可以被静默删掉/改名/skip
      # 而流水线全绿——P3 到 Task 3 为止这样的用例有 **62 条**（Task 2 的 15 条真库强制点
      # + Task 3 的 47 条交换纯核心），是当时最大的开放项。
      #
      # 这一步因此按**文件/路径前缀**跑它们（`SCOPED_GATES`），判据与 security/architecture
      # 逐字相同：**实际执行**条数不得低于登记的下限（skip/todo 不计入），且全部通过。
      # 判别力是双向实测的（`.superpowers/…/evidence/t4-probe-matrix-item0.txt`）：
      # 无 skip ⇒ `✔ 实际执行 47 条（下限 47）` / 退出 0；把其中一条改成 `it.skip` ⇒
      # `::error::exchange-core：只执行了 46 条…` 且退出 1；把文件改名搬走 ⇒ 同样以
      # `::error::<组名>` 退出 1；而把一个**作用域之外**的文件搬走 ⇒ 照样绿（证明它是按
      # 路径跑的，不是整跑 project）。
      - name: 按路径作用域的下限（真库强制点 + 交换纯核心）
        run: node scripts/assert-tests-ran.mjs exchange-enforcement exchange-core

      # 威胁 #14（供应链）。
      #
      # 已知的 3 条（Prisma CLI 子树：deepmerge-ts / mysql2）已在 `pnpm-workspace.yaml` 的
      # `auditConfig.ignoreGhsas` 里**逐条书面豁免**并写明理由与移除条件。因此这一步现在的语义是
      # 「不许**新增** high/critical」——豁免是显式的、进 code review 的，而不是把阈值调高。
      - name: 依赖审计（威胁 #14）
        run: |
          pnpm audit --audit-level high || \
            (echo "::error::存在新增的 high/critical 依赖漏洞：要么修复，要么在 pnpm-workspace.yaml 的 auditConfig.ignoreGhsas 里逐条豁免（附理由与移除条件）" && exit 1)
